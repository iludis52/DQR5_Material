<h1 id="quiz-main-title">CNN &amp; Bildklassifikation</h1>
<p class="subtitle">Wiederholungsquiz &ndash; Beispiel &bdquo;Reifegrad-Erkennung&ldquo; bei Obst</p>

<div class="quiz-container" id="quiz-container"></div>

<div class="quiz-container">
    <div class="final-result" id="final-result">
        <h2>Quiz abgeschlossen!</h2>
        <p>Du hast alle Fragen beantwortet. Insgesamt hast du <strong id="final-mistakes">0</strong> Fehler gemacht.</p>
        <button onclick="location.reload()" style="background: #3498db; color: white; border: none; text-align: center; margin-top: 15px; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem;">Quiz neustarten</button>
    </div>
</div>

<script>
    const questions = [
        {
                "text": "Welche Rolle spielt eine Faltungsschicht (Convolutional Layer) in einem CNN?",
                "options": [
                        "Sie reduziert die Bildgröße, indem benachbarte Pixel zu einem einzigen Ausgabewert zusammengefasst werden.",
                        "Sie wendet lernbare Filter lokal auf das Bild an und extrahiert Merkmale wie Kanten oder Texturen.",
                        "Sie sortiert die Pixel eines Bildes nach ihrer Helligkeit, um es vor der Weiterverarbeitung zu normieren.",
                        "Sie wandelt das zweidimensionale Bild in einen eindimensionalen Vektor für die Dense-Schicht um dabei."
                ],
                "correct": 1,
                "explanation": "Faltungsschichten schieben lernbare, kleine Filter (Kernel) über das Bild und erzeugen so Feature Maps, die lokale Muster wie Kanten oder Texturen hervorheben."
        },
        {
                "text": "Welche Rolle spielt eine MaxPooling-Schicht in einem CNN?",
                "options": [
                        "Sie multipliziert jede Aktivierung mit einem lernbaren Gewicht und addiert anschließend einen Bias-Wert.",
                        "Sie berechnet für jeden Pixel den Mittelwert aller Kanäle und fasst das Bild so in Graustufen zusammen.",
                        "Sie fasst benachbarte Aktivierungen durch Auswahl des Maximalwerts zusammen und reduziert so Höhe und Breite.",
                        "Sie verbindet jedes Neuron der vorherigen Schicht vollständig mit jedem Neuron der Folgeschicht."
                ],
                "correct": 2,
                "explanation": "MaxPooling verkleinert die Feature Maps, indem es aus kleinen Nachbarschaften jeweils den größten Wert übernimmt – das reduziert Rechenaufwand und macht die Darstellung robuster gegen kleine Verschiebungen. Lernbare Parameter besitzt die Schicht dabei nicht."
        },
        {
                "text": "Ein CNN zur Reifegrad-Erkennung von Früchten erhält Farbbilder der Größe 40×40×3 (Höhe×Breite×Kanäle) als Eingang. Conv1 hat 16 Filter, Kernelgröße 3×3, Stride 1, kein Padding. Berechnen Sie Höhe, Breite und Kanalzahl der Ausgabe nach Conv1.",
                "svgId": "svg-cnn-arch",
                "options": [
                        "38 × 38 × 16",
                        "38 × 38 × 3",
                        "40 × 40 × 16",
                        "37 × 37 × 16"
                ],
                "correct": 0,
                "explanation": "Höhe/Breite: (40−3)/1+1 = 38. Die Kanalzahl der Ausgabe entspricht der Filteranzahl von Conv1, also 16. Ergebnis: 38×38×16."
        },
        {
                "text": "Auf die Ausgabe von Conv1 (38×38×16) folgt Pool1 mit MaxPooling, Fenstergröße 2×2, Stride 2, kein Padding. Berechnen Sie Höhe, Breite und Kanalzahl der Ausgabe nach Pool1.",
                "svgId": "svg-cnn-arch",
                "options": [
                        "19 × 19 × 8",
                        "18 × 18 × 16",
                        "20 × 20 × 16",
                        "19 × 19 × 16"
                ],
                "correct": 3,
                "explanation": "Höhe/Breite: (38−2)/2+1 = 19. MaxPooling verändert die Kanalzahl nicht, sie bleibt bei 16. Ergebnis: 19×19×16."
        },
        {
                "text": "Berechnen Sie die Anzahl lernbarer Parameter von Conv1 (16 Filter, Kernel 3×3, Eingang mit 3 Kanälen) inklusive Bias.",
                "svgId": "svg-cnn-arch",
                "options": [
                        "144",
                        "150",
                        "448",
                        "432"
                ],
                "correct": 2,
                "explanation": "Parameter = k_h · k_w · C_in · C_out + C_out = 3·3·3·16 + 16 = 432 + 16 = 448. Wichtig: C_in = 3, da der Eingang ein Farbbild mit drei Kanälen ist."
        },
        {
                "text": "Nach Flatten liegen 19×19×16 = 5.776 Werte vor. Die Dense-Schicht hat 3 Ausgabeneuronen (unreif / reif / überreif). Berechnen Sie die Anzahl lernbarer Parameter der Dense-Schicht inklusive Bias.",
                "svgId": "svg-cnn-arch",
                "options": [
                        "5.779",
                        "17.331",
                        "17.334",
                        "17.328"
                ],
                "correct": 1,
                "explanation": "Parameter = n_in · n_out + n_out = 5.776 · 3 + 3 = 17.328 + 3 = 17.331."
        },
        {
                "text": "Welche Schicht des Netzes trägt die meisten Parameter, und warum?",
                "options": [
                        "Beide Schichten besitzen exakt gleich viele Parameter, da sie auf denselben Eingabedaten arbeiten.",
                        "Die Faltungsschicht, da sie für jedes einzelne Pixel des Eingabebilds einen eigenen Parametersatz benötigt.",
                        "Die Pooling-Schicht, da sie zusätzlich zu den Gewichten noch eigene Schwellenwerte lernen muss.",
                        "Die Dense-Schicht, da hier jedes der 5.776 Flatten-Neuronen mit jedem Ausgabeneuron verbunden ist."
                ],
                "correct": 3,
                "explanation": "Dense-Schichten sind vollverbunden: jedes Eingabeneuron ist mit jedem Ausgabeneuron verbunden. Bei großen Flatten-Vektoren übersteigt das die Parameterzahl lokal verbundener Faltungsschichten meist deutlich."
        },
        {
                "text": "Abbildung 2 zeigt Trainings- und Validierungsfehler für unterschiedliche Filterzahlen in Conv1. Welche Filterzahl ist am besten geeignet, wenn man sowohl den Validierungsfehler als auch den Abstand zwischen Trainings- und Validierungskurve berücksichtigt?",
                "svgId": "svg-filter-curve",
                "options": [
                        "16 Filter",
                        "64 Filter",
                        "32 Filter",
                        "4 Filter"
                ],
                "correct": 0,
                "explanation": "Bei 16 Filtern ist der Validierungsfehler am niedrigsten und der Abstand zur Trainingskurve noch klein. Ab 32 Filtern steigt der Validierungsfehler wieder, während der Trainingsfehler weiter sinkt – ein klares Overfitting-Signal."
        },
        {
                "text": "Angenommen man würde in Conv1 statt Stride 1 einen Stride von 2 verwenden (Kernel weiterhin 3×3, 16 Filter, Eingang 40×40×3, kein Padding). Berechnen Sie Höhe, Breite und Kanalzahl der Ausgabe nach Conv1 (Ergebnis ggf. abrunden).",
                "options": [
                        "18 × 18 × 16",
                        "20 × 20 × 16",
                        "19 × 19 × 16",
                        "19,5 × 19,5 × 16"
                ],
                "correct": 2,
                "explanation": "Höhe/Breite: (40−3)/2+1 = 18,5+1 → zuerst abrunden (18), dann +1 = 19. Die Kanalzahl bleibt bei 16 Filtern. Ergebnis: 19×19×16."
        },
        {
                "text": "Hätte das Netz statt drei nur zwei Ausgabeneuronen (z. B. nur reif/unreif statt drei Reifestufen), wie viele lernbare Parameter hätte die Dense-Schicht bei weiterhin 5.776 Flatten-Werten, inklusive Bias?",
                "svgId": "svg-cnn-arch",
                "options": [
                        "11.552",
                        "5.778",
                        "17.331",
                        "11.554"
                ],
                "correct": 3,
                "explanation": "Parameter = n_in · n_out + n_out = 5.776 · 2 + 2 = 11.552 + 2 = 11.554. Die Antwort 17.331 wäre die alte Parameterzahl mit drei statt zwei Ausgabeneuronen."
        },
        {
                "text": "Von jeder physischen Frucht wurden mehrere Fotos aus verschiedenen Blickwinkeln gemacht (im Mittel fünf Fotos je Frucht). Die Aufteilung in Trainings-, Validierungs- und Testdaten erfolgte rein zufällig auf Bildebene. Warum ist das problematisch, und was wäre die geeignete Gegenmaßnahme?",
                "options": [
                        "Das ist unproblematisch, da jedes Foto ein eigenständiger, vollständig unabhängiger Datenpunkt ist.",
                        "Fotos derselben Frucht ähneln sich stark und landen oft in mehreren Mengen; besser ist eine Aufteilung auf Fruchtebene.",
                        "Problematisch ist nur die Gesamtzahl der Fotos; eine Aufteilung auf Fruchtebene ändert daran gar nichts.",
                        "Die Aufteilung führt zu einem zu kleinen Trainingsdatensatz, Abhilfe schafft nur das Sammeln weiterer Früchte."
                ],
                "correct": 1,
                "explanation": "Da mehrere Fotos derselben Frucht sich stark ähneln, können sie über Train-, Validierungs- und Testmenge verteilt landen – das Modell 'erkennt' dann teils dieselbe Frucht wieder, statt wirklich zu generalisieren. Eine Aufteilung auf Fruchtebene (alle Fotos einer Frucht in derselben Menge) verhindert dieses Datenleck."
        },
        {
                "text": "Warum wird bei der Parameterberechnung ausdrücklich betont, dass der Bias 'überall mitzählt'?",
                "options": [
                        "Jede Faltungs- und Dense-Schicht besitzt neben den Gewichten einen Bias pro Ausgabeeinheit, der leicht vergessen wird.",
                        "Der Bias existiert ausschließlich in der allerletzten Schicht eines Netzes und ist dort zwingend vorgeschrieben.",
                        "Ohne einen zusätzlichen Bias-Term wäre die Aktivierungsfunktion ReLU rein rechnerisch gar nicht anwendbar.",
                        "Ausschließlich die MaxPooling-Schichten besitzen einen eigenen Bias, alle anderen Schichten dagegen nicht."
                ],
                "correct": 0,
                "explanation": "Sowohl Faltungs- als auch Dense-Schichten besitzen pro Ausgabeeinheit (Filter bzw. Neuron) einen eigenen Bias-Parameter zusätzlich zu den Gewichten. Er wird bei der Parameterzählung häufig übersehen, trägt aber zur Gesamtzahl bei."
        }
];

    let correctCount = 0;
    let mistakeCount = 0;

    function initQuiz() {
        const container = document.getElementById('quiz-container');

        questions.forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `question-card-${qIndex}`;

            const title = document.createElement('div');
            title.className = 'question-title';
            title.textContent = `Frage ${qIndex + 1} von ${questions.length}`;

            const text = document.createElement('div');
            text.className = 'question-text';
            text.textContent = q.text;

            card.appendChild(title);
            card.appendChild(text);

            if (q.svgId) {
                const svgSource = document.getElementById(q.svgId);
                if (svgSource) {
                    const svgContainer = document.createElement('div');
                    svgContainer.className = 'question-svg-container';
                    svgContainer.innerHTML = svgSource.innerHTML;
                    card.appendChild(svgContainer);
                } else {
                    console.warn(`SVG mit ID '${q.svgId}' nicht gefunden.`);
                }
            }

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options';

            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(qIndex, optIndex, btn);
                optionsContainer.appendChild(btn);
            });

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.id = `feedback-${qIndex}`;

            card.appendChild(optionsContainer);
            card.appendChild(feedback);
            container.appendChild(card);
        });
    }

    function handleAnswer(qIndex, optIndex, btnElement) {
        const q = questions[qIndex];
        const card = document.getElementById(`question-card-${qIndex}`);
        const feedback = document.getElementById(`feedback-${qIndex}`);

        if (card.classList.contains('completed')) return;

        if (optIndex === q.correct) {
            btnElement.classList.add('correct');
            card.classList.add('completed');

            const allBtns = card.querySelectorAll('button');
            allBtns.forEach(b => b.disabled = true);

            feedback.className = 'feedback correct-feedback';
            feedback.innerHTML = `<strong>Richtig!</strong> ${q.explanation}`;
            feedback.style.display = 'block';

            correctCount++;
            updateProgress();
        } else {
            btnElement.classList.add('wrong');
            btnElement.disabled = true;

            mistakeCount++;
            document.getElementById('mistake-counter').textContent = mistakeCount;

            feedback.className = 'feedback wrong-feedback';
            feedback.innerHTML = `<strong>Leider falsch.</strong> Versuche es noch einmal!`;
            feedback.style.display = 'block';
        }
    }

    function updateProgress() {
        const percent = Math.round((correctCount / questions.length) * 100);
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('progress-text').textContent = percent + '%';

        if (correctCount === questions.length) {
            document.getElementById('final-mistakes').textContent = mistakeCount;
            document.getElementById('final-result').style.display = 'block';
        }
    }

    document.addEventListener("DOMContentLoaded", initQuiz);
</script>
