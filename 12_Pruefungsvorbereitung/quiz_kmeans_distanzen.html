    <style>
        body {

            margin: 0;

        /* Statusleiste */
        .status-bar {
            position: sticky;
            top: 0;
            background: white;
            padding: 15px 20px;

            z-index: 100;
            display: flex;
            flex-direction: column;

        .progress-container {
            width: 100%;

            border-radius: 8px;

            height: 12px;

        .progress-bar {
            height: 100%;

        h1 { text-align: center; color: #2c3e50; margin-top: 40px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-top: -10px; margin-bottom: 10px; font-size: 1rem; }

        .question-title {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;

        .question-text {
            font-size: 1.15rem;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 600;
            line-height: 1.5;
        }

        .question-svg-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            padding: 15px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .question-svg-container svg {
            max-width: 100%;
            height: auto;
            max-height: 420px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;

            text-align: left;

        button:hover:not([disabled]) {
            background-color: #f0f8ff;
            border-color: #3498db;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        button.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }

        button.wrong {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
            text-decoration: line-through;
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .feedback.correct-feedback {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.wrong-feedback {
            background-color: #f8d7da;

            border: 1px solid #f5c6cb;

        .final-result {

<h1 id="quiz-main-title">k-Means &amp; Distanzberechnung</h1>
<p class="subtitle">Wiederholungsquiz &ndash; Beispiel &bdquo;PulsFit&ldquo; Fitnessstudio-Mitglieder</p>

<div class="quiz-container" id="quiz-container"></div>

    </div>

<script>
    const questions = [
        {
                "text": "Im Fitnessstudio „PulsFit“ möchte das Team die Mitglieder ohne vorhandene Gruppen-Label anhand ihres Verhaltens in Gruppen einteilen. Um welches Lernparadigma handelt es sich beim k-Means-Verfahren?",
                "options": [
                        "Überwachtes Lernen, da eine Zielvariable vorhergesagt wird.",
                        "Unüberwachtes Lernen, da keine Zielvariable/Klassenlabels vorliegen.",
                        "Bestärkendes Lernen, da das Modell durch Belohnung trainiert wird.",
                        "Semi-überwachtes Lernen, da nur ein Teil der Daten gelabelt ist."
                ],
                "correct": 1,
                "explanation": "k-Means gruppiert Datenpunkte ausschließlich anhand ihrer Merkmalsähnlichkeit, ohne dass vorab bekannte Klassenlabels genutzt werden – das ist die Definition von unüberwachtem Lernen."
        },
        {
                "text": "Welche Reihenfolge beschreibt den grundlegenden Ablauf des k-Means-Algorithmus korrekt?",
                "options": [
                        "Zentroide initialisieren → Punkte dem nächsten Zentroiden zuordnen → Zentroide neu berechnen → wiederholen, bis die Zuordnung stabil bleibt.",
                        "Punkte zufällig in k Gruppen einteilen → Distanzen berechnen → Anzahl Cluster k danach bestimmen → Zentroide erst am Ende festlegen.",
                        "Zentroide zuerst neu berechnen → Anzahl Cluster k festlegen → Punkte zuordnen → Zentroide erst danach initialisieren.",
                        "Alle Punkte zuerst einem einzigen Cluster zuordnen → diesen schrittweise aufteilen, bis k Cluster entstanden sind."
                ],
                "correct": 0,
                "explanation": "k-Means ist ein iteratives Verfahren (Lloyd-Algorithmus): Nach der Initialisierung der Startzentroide wechseln sich Zuordnungsschritt und Aktualisierungsschritt ab, bis der Algorithmus konvergiert (die Zuordnung sich nicht mehr ändert)."
        },
        {
                "text": "Bei PulsFit wird die Trainingshäufigkeit in Besuchen/Monat (0–30) und die monatlichen Ausgaben in Euro (0–300) erfasst. Warum sollten diese Merkmale vor dem k-Means-Clustering standardisiert werden?",
                "options": [
                        "Damit beide Merkmale einen vergleichbaren Wertebereich haben und keines die Distanzberechnung allein dominiert.",
                        "Damit der Algorithmus schneller konvergiert – die Distanzberechnung selbst wird davon nicht beeinflusst.",
                        "Standardisierung ist nur bei kategorischen Merkmalen nötig, hier also verzichtbar.",
                        "Damit sich die benötigte Anzahl an Clustern k automatisch reduziert."
                ],
                "correct": 0,
                "explanation": "Die euklidische Distanz vergleicht alle Merkmale direkt. Ohne Standardisierung würde das Merkmal mit der größeren Skala (hier: Ausgaben in Euro) die Distanz dominieren. Durch z-Score-Standardisierung erhalten beide Merkmale vergleichbares Gewicht."
        },
        {
                "text": "Abbildung 1 zeigt acht PulsFit-Mitglieder (K1–K8) sowie zwei Startzentroide Z1 und Z2 im Raum der standardisierten Merkmale. Berechnen Sie die quadrierte euklidische Distanz d²(K3, Z1).",
                "svgId": "svg-scatter-main",
                "options": [
                        "1",
                        "2",
                        "5",
                        "10"
                ],
                "correct": 0,
                "explanation": "K3 liegt bei (4|1), Z1 bei (3|1). d²(K3,Z1) = (4−3)² + (1−1)² = 1² + 0² = 1."
        },
        {
                "text": "Berechnen Sie nun die quadrierte euklidische Distanz d²(K3, Z2) (Koordinaten weiterhin aus Abbildung 1).",
                "svgId": "svg-scatter-main",
                "options": [
                        "41",
                        "50",
                        "61",
                        "70"
                ],
                "correct": 2,
                "explanation": "K3 liegt bei (4|1), Z2 bei (9|7). d²(K3,Z2) = (4−9)² + (1−7)² = (−5)² + (−6)² = 25 + 36 = 61."
        },
        {
                "text": "Welchem Cluster wird K3 auf Basis der beiden zuvor berechneten Distanzen zugeordnet?",
                "options": [
                        "Zentroid Z1, da d²(K3,Z1)=1 kleiner ist als d²(K3,Z2)=61.",
                        "Zentroid Z2, da Z2 weiter von den übrigen Punkten entfernt liegt.",
                        "Keinem der beiden, da die Distanzen zu unterschiedlich sind.",
                        "Beiden Clustern gleichzeitig, da k-Means weiche Zuordnungen verwendet."
                ],
                "correct": 0,
                "explanation": "Beim (harten) k-Means wird jeder Punkt dem Zentroiden mit der geringeren Distanz zugeordnet – hier eindeutig Z1."
        },
        {
                "text": "Berechnen Sie die quadrierte euklidische Distanz d²(K7, Z2) (Koordinaten aus Abbildung 1).",
                "svgId": "svg-scatter-main",
                "options": [
                        "2",
                        "4",
                        "9",
                        "14"
                ],
                "correct": 0,
                "explanation": "K7 liegt bei (10|8), Z2 bei (9|7). d²(K7,Z2) = (10−9)² + (8−7)² = 1 + 1 = 2."
        },
        {
                "text": "Warum verwendet man beim k-Means-Algorithmus für die Cluster-Zuordnung meist die quadrierte euklidische Distanz statt der 'echten' (Wurzel-)euklidischen Distanz?",
                "options": [
                        "Weil die Wurzelfunktion streng monoton steigend ist – das Ranking der Distanzen ändert sich dadurch nicht, die Wurzel entfällt nur.",
                        "Weil die quadrierte Distanz grundsätzlich kleinere und dadurch leichter interpretierbare Zahlenwerte liefert als die echte Distanz.",
                        "Weil ohne das Quadrieren bei der Berechnung negative Distanzwerte zwischen den Punkten entstehen könnten.",
                        "Weil k-Means rein mathematisch nur mit quadrierten Werten definiert ist und die Wurzel-Variante dabei gar nicht existiert."
                ],
                "correct": 0,
                "explanation": "Da die Wurzelfunktion monoton ist, führt der Vergleich der quadrierten Distanzen zum selben Ergebnis wie der Vergleich der echten Distanzen – man spart sich pro Iteration viele Wurzelberechnungen."
        },
        {
                "text": "Nach vollständiger Zuordnung aller acht Mitglieder liegen K1, K2, K3 und K4 im Cluster um Z1. Berechnen Sie den neuen Zentroiden dieses Clusters als Mittelwert der zugeordneten Koordinaten (Werte aus Abbildung 1: K1(1|2), K2(2|4), K3(4|1), K4(3|3)).",
                "svgId": "svg-scatter-main",
                "options": [
                        "(2,5 | 2,5)",
                        "(3 | 2)",
                        "(2 | 3)",
                        "(2,5 | 3,5)"
                ],
                "correct": 0,
                "explanation": "x̄ = (1+2+4+3)/4 = 2,5; ȳ = (2+4+1+3)/4 = 2,5 → neuer Zentroid (2,5 | 2,5)."
        },
        {
                "text": "Die übrigen vier Mitglieder K5(7|9), K6(9|6), K7(10|8) und K8(8|7) liegen im Cluster um Z2. Berechnen Sie den neuen Zentroiden dieses Clusters.",
                "svgId": "svg-scatter-main",
                "options": [
                        "(9 | 7)",
                        "(8 | 8)",
                        "(8,5 | 8,5)",
                        "(8,5 | 7,5)"
                ],
                "correct": 3,
                "explanation": "x̄ = (7+9+10+8)/4 = 8,5; ȳ = (9+6+8+7)/4 = 7,5 → neuer Zentroid (8,5 | 7,5)."
        },
        {
                "text": "Wie unterscheidet sich die Manhattan-Distanz von der euklidischen Distanz, und wann wird sie in der Praxis bevorzugt eingesetzt?",
                "options": [
                        "Sie summiert die Beträge der Differenzen je Achse statt sie zu quadrieren und zu wurzeln, und reagiert daher weniger empfindlich auf Ausreißer.",
                        "Sie ist mathematisch identisch mit der euklidischen Distanz und unterscheidet sich nur durch ihren anderen, historisch gewachsenen Namen.",
                        "Sie berücksichtigt bei der Berechnung ausschließlich die größte Differenz einer einzelnen Achse, alle anderen werden ignoriert.",
                        "Sie lässt sich ihrer Definition nach ausschließlich für kategorische, nicht für numerische Merkmale sinnvoll berechnen."
                ],
                "correct": 0,
                "explanation": "Manhattan-Distanz: d = |x₁−x₂| + |y₁−y₂|. Da einzelne große Differenzen nicht quadriert werden, wirken sich Ausreißer weniger stark aus als bei der euklidischen Distanz."
        },
        {
                "text": "Abbildung 2 zeigt die Gesamtstreuung innerhalb der Cluster (WCSS) für verschiedene Werte von k. Bei welchem k liegt der 'Ellbogen', der laut Elbow-Methode als sinnvolle Clusteranzahl vorgeschlagen wird?",
                "svgId": "svg-elbow",
                "options": [
                        "k = 2",
                        "k = 3",
                        "k = 5",
                        "k = 6"
                ],
                "correct": 1,
                "explanation": "Bis k=3 sinkt die WCSS stark (deutlicher Nutzenzuwachs je zusätzlichem Cluster), danach flacht die Kurve merklich ab – das ist der charakteristische Knick ('Ellbogen'), der k=3 als guten Kompromiss vorschlägt."
        }
];

    let correctCount = 0;
    let mistakeCount = 0;

    function initQuiz() {
        const container = document.getElementById('quiz-container');

        questions.forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `question-card-${qIndex}`;

            const title = document.createElement('div');
            title.className = 'question-title';
            title.textContent = `Frage ${qIndex + 1} von ${questions.length}`;

            const text = document.createElement('div');
            text.className = 'question-text';
            text.textContent = q.text;

            card.appendChild(title);
            card.appendChild(text);

            if (q.svgId) {
                const svgSource = document.getElementById(q.svgId);
                if (svgSource) {
                    const svgContainer = document.createElement('div');
                    svgContainer.className = 'question-svg-container';
                    svgContainer.innerHTML = svgSource.innerHTML;
                    card.appendChild(svgContainer);
                } else {
                    console.warn(`SVG mit ID '${q.svgId}' nicht gefunden.`);
                }
            }

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options';

            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(qIndex, optIndex, btn);
                optionsContainer.appendChild(btn);
            });

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.id = `feedback-${qIndex}`;

            card.appendChild(optionsContainer);
            card.appendChild(feedback);
            container.appendChild(card);
        });
    }

    function handleAnswer(qIndex, optIndex, btnElement) {
        const q = questions[qIndex];
        const card = document.getElementById(`question-card-${qIndex}`);
        const feedback = document.getElementById(`feedback-${qIndex}`);

        if (card.classList.contains('completed')) return;

        if (optIndex === q.correct) {
            btnElement.classList.add('correct');
            card.classList.add('completed');

            const allBtns = card.querySelectorAll('button');
            allBtns.forEach(b => b.disabled = true);

            feedback.className = 'feedback correct-feedback';
            feedback.innerHTML = `<strong>Richtig!</strong> ${q.explanation}`;
            feedback.style.display = 'block';

            correctCount++;
            updateProgress();
        } else {
            btnElement.classList.add('wrong');
            btnElement.disabled = true;

            mistakeCount++;
            document.getElementById('mistake-counter').textContent = mistakeCount;

            feedback.className = 'feedback wrong-feedback';
            feedback.innerHTML = `<strong>Leider falsch.</strong> Versuche es noch einmal!`;
            feedback.style.display = 'block';
        }
    }

    function updateProgress() {
        const percent = Math.round((correctCount / questions.length) * 100);
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('progress-text').textContent = percent + '%';

        if (correctCount === questions.length) {
            document.getElementById('final-mistakes').textContent = mistakeCount;
            document.getElementById('final-result').style.display = 'block';
        }
    }

    document.addEventListener("DOMContentLoaded", initQuiz);
</script>
