<script>

    const questions = [

        "correct": 1,

    {
        "text": "Welcher Pfeil in derselben Abbildung passt zur zweiten Hauptkomponente (HK2)?",

    {
        "text": "Durch welchen Punkt verlaufen die Achsen der Hauptkomponenten?",

    {

            "Es gibt keine eindeutig ausgezeichnete Richtung größter Streuung.",

    {
        "text": "Für zwei standardisierte Merkmale gilt HK1 = 0,6 · z₁ + w₂ · z₂ mit positivem Gewicht w₂. Welchen Wert hat w₂?",

    {

    },
    {
        "text": "Welche Aussage über die Komponentenwerte auf den Trainingsdaten trifft zu?",

    {

            "8",
            "100"

        "correct": 2,

    {

            "3,2 %",
            "40 %",
            "32 %",
            "25 %"

        "correct": 1,
        "explanation": "Erklärte Varianz = Varianz der Komponente / Gesamtvarianz = 3,2 / 8 = 0,40 = 40 %."
    },
    {

        "options": [
            "3 Komponenten",
            "4 Komponenten",
            "6 Komponenten",
            "2 Komponenten"
        ],
        "correct": 1,
        "explanation": "Kumuliert: 45 % → 70 % → 85 % → 93 %. Erst mit HK4 wird die 90-%-Schwelle überschritten; drei Komponenten erreichen nur 85 %."
    },
    {
        "text": "Was sucht man in einem Scree-Plot typischerweise?",
        "options": [
            "Einen Knick, nach dem kaum noch Varianz hinzukommt",
            "Den Schnittpunkt der Balken mit der kumulierten Zielvariable",
            "Die Komponente mit der höchsten Genauigkeit des Modells",
            "Die erste Komponente, deren Gewichte alle positiv sind"
        ],
        "correct": 0,
        "explanation": "Nach dem Knick tragen weitere Komponenten nur noch wenig zusätzliche Varianz bei. Der Knick ist – wie eine Prozentschwelle – eine Entscheidungshilfe, keine Garantie."
    },
    {
        "text": "Was stellen die roten Verbindungslinien in der Abbildung dar?",
        "svgId": "svg-projektion",
        "options": [
            "Die Gewichte der beiden Merkmale in HK1",
            "Den bei Reduktion auf HK1 verworfenen Anteil",
            "Die Abstände der einzelnen Punkte zum Schwerpunkt",

        "correct": 1,
        "explanation": "Jeder Punkt wird senkrecht auf HK1 projiziert und nur noch durch seinen Komponentenwert beschrieben. Die roten Abstände in Richtung HK2 gehen verloren – das ist der Informationsverlust. (Achtung: Bei einer Regression wären die Fehler senkrecht zur z₁-Achse gemessen, nicht senkrecht zur Geraden.)"

    {
        "text": "Was bewirkt es, wenn man bei der PCA alle Komponenten behält?",

        "correct": 2,

    },
    {
        "text": "Mit 5 Komponenten werden 95 % der Varianz erklärt. Welche Schlussfolgerung ist korrekt?",

        "correct": 2,
        "explanation": "Hohe erklärte Varianz ≠ hohe Vorhersagegüte. Die Prozente beschreiben die Streuung der Eingaben; gerade eine Richtung mit wenig Varianz kann für die Vorhersage entscheidend sein."
    },
    {
        "text": "Wie sollte die Komponentenzahl bei einer Vorhersageaufgabe zusätzlich beurteilt werden?",

        "correct": 0,

    {

    let correctCount = 0;
    let mistakeCount = 0;

    function initQuiz() {
        const container = document.getElementById('quiz-container');

        questions.forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `question-card-${qIndex}`;

            const title = document.createElement('div');
            title.className = 'question-title';
            title.textContent = `Frage ${qIndex + 1} von ${questions.length}`;

            const text = document.createElement('div');
            text.className = 'question-text';
            text.textContent = q.text;

            card.appendChild(title);
            card.appendChild(text);

            // --- NEU: SVG Injektion ---
            if (q.svgId) {
                const svgSource = document.getElementById(q.svgId);
                if (svgSource) {
                    const svgContainer = document.createElement('div');
                    svgContainer.className = 'question-svg-container';
                    // Kopiert den HTML/SVG-Code aus dem versteckten Container
                    svgContainer.innerHTML = svgSource.innerHTML; 
                    card.appendChild(svgContainer);
                } else {
                    console.warn(`SVG mit ID '${q.svgId}' nicht gefunden.`);
                }
            }
            // --------------------------

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options';

            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(qIndex, optIndex, btn);
                optionsContainer.appendChild(btn);
            });

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.id = `feedback-${qIndex}`;

            card.appendChild(optionsContainer);
            card.appendChild(feedback);
            container.appendChild(card);
        });
    }

    function handleAnswer(qIndex, optIndex, btnElement) {
        const q = questions[qIndex];
        const card = document.getElementById(`question-card-${qIndex}`);
        const feedback = document.getElementById(`feedback-${qIndex}`);

        if (card.classList.contains('completed')) return; 

        if (optIndex === q.correct) {
            btnElement.classList.add('correct');
            card.classList.add('completed'); 

            const allBtns = card.querySelectorAll('button');
            allBtns.forEach(b => b.disabled = true);

            feedback.className = 'feedback correct-feedback';
            feedback.innerHTML = `<strong>Richtig!</strong> ${q.explanation}`;
            feedback.style.display = 'block';

            correctCount++;
            updateProgress();
        } else {
            btnElement.classList.add('wrong');
            btnElement.disabled = true; 

            mistakeCount++;
            document.getElementById('mistake-counter').textContent = mistakeCount;

            feedback.className = 'feedback wrong-feedback';
            feedback.innerHTML = `<strong>Leider falsch.</strong> Versuche es noch einmal!`;
            feedback.style.display = 'block';
        }
    }

    function updateProgress() {
        const percent = Math.round((correctCount / questions.length) * 100);
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('progress-text').textContent = percent + '%';

        if (correctCount === questions.length) {
            document.getElementById('final-mistakes').textContent = mistakeCount;
            document.getElementById('final-result').style.display = 'block';
        }
    }

    document.addEventListener("DOMContentLoaded", initQuiz);
</script>
