                if (!dimInfo.valid || !trainRef.current.length) return;
                if (!netRef.current) buildNetwork();
                // Seed the batch-shuffle RNG (distinct from init/split, still deterministic per seed).
                trainRngRef.current = mulberry32((seedRef.current ^ 0x9e3779b9) >>> 0);
                const order = []; for (let i = 0; i < trainRef.current.length; i++) order.push(i);
                if (shuffleRef.current) shuffleInPlace(order, trainRngRef.current);
                orderRef.current = order; cursorRef.current = 0;
                runRef.current = true; setRunning(true); requestAnimationFrame(trainLoop);
            };
            const onStop = () => { runRef.current = false; setRunning(false); };
            const onReset = () => { runRef.current = false; setRunning(false); buildNetwork(); };
            const onEvaluate = () => {
                if (!netRef.current || !splits.test.length) return;
                let correct = 0;
                for (const s of splits.test) { const { output } = forwardCNN(netRef.current, s.input); if (output.indexOf(Math.max(...output)) === s.output.indexOf(Math.max(...s.output))) correct++; }
                setTestAcc(correct / splits.test.length * 100);
            };

            const trainDisabled = running || !dimInfo.valid || !trainRef.current.length;
            const btnBase = { border: "none", padding: "7px 16px", borderRadius: 6, fontSize: 12, fontFamily: C.fontSans, fontWeight: 700, cursor: "pointer" };
            const selectedSample = data[selected] || null;

            // ── Import / Export network ────────────────────────────────
            const onExportNet = () => {
                if (!netRef.current) { alert("No network to export"); return; }
                try {
                    const json = exportNetwork(netRef.current, { inputLabels: inputNames, outputLabels: outputNames, imageWidth: imgW, imageHeight: imgH, networkName: preset === "Custom" ? "custom_cnn" : preset.toLowerCase() + "_cnn" });
                    downloadFile(JSON.stringify(json, null, 2), json.network_name + ".json", "application/json");
                } catch (e) { alert("Export failed: " + e.message); }
            };
            const onImportNet = () => {
                const input = document.createElement('input');
                input.type = 'file'; input.accept = '.json';
                input.onchange = async (e) => {
                    const file = e.target.files[0]; if (!file) return;
                    try {
                        const cfg = importNetwork(JSON.parse(await file.text()));
                        skipBuildRef.current = true;
                        netRef.current = cfg.network;
                        setImgW(cfg.imageWidth); setImgH(cfg.imageHeight);
                        setInputNames(cfg.inputNames); setOutputNames(cfg.outputNames);
                        setArch(cfg.arch); setPreset("Custom");
                        resetTraining();
                    } catch (err) { alert("Import failed: " + (err.message || err)); }
                };
                input.click();
            };

            return (
                <div style={{ width: 1200, minHeight: 800, background: C.bg, color: C.text, fontFamily: C.fontSans, display: "flex", flexDirection: "column", borderRadius: 10, border: "1px solid " + C.border, boxShadow: "0 2px 24px rgba(0,0,0,0.08)" }}>
                    {/* HEADER */}
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 16px", borderBottom: "1px solid " + C.border, flexShrink: 0, background: C.surface }}>
                        <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
                            <h1 style={{ fontSize: 16, fontWeight: 700, margin: 0, fontFamily: C.font, letterSpacing: -.5, color: C.text }}>CNN Grayscale Trainer</h1>
                            <span style={{ fontSize: 10, color: C.textDim, fontFamily: C.font }}>{preset === "Custom" ? "Custom Dataset" : preset}</span>
                        </div>
                        <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                            <button onClick={loadPatterns} style={{ background: preset === "Patterns" ? C.accent + "18" : "transparent", border: "1px solid " + (preset === "Patterns" ? C.accent + "66" : C.border), color: preset === "Patterns" ? C.accent : C.textDim, padding: "4px 11px", borderRadius: 5, fontSize: 10, cursor: "pointer", fontFamily: C.font, fontWeight: preset === "Patterns" ? 700 : 400 }}>Patterns</button>
                        </div>
                    </div>

                    {/* CONTROLS */}
                    <div style={{ padding: "6px 16px", borderBottom: "1px solid " + C.border, flexShrink: 0, background: C.surface, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                        <button onClick={onTrain} disabled={trainDisabled} style={{ ...btnBase, background: trainDisabled ? C.surface2 : C.accent, color: trainDisabled ? C.textDim : "#fff" }}>▶ Train</button>
                        <button onClick={onStop} disabled={!running} style={{ ...btnBase, background: !running ? C.surface2 : C.orange, color: !running ? C.textDim : "#fff" }}>■ Stop</button>
                        <button onClick={onReset} style={{ ...btnBase, background: C.surface2, color: C.text, border: "1px solid " + C.border }}>↺ Reset</button>
                        <button onClick={onEvaluate} disabled={!splits.test.length} style={{ ...btnBase, background: C.accent2, color: "#fff" }}>✓ Evaluate</button>
                        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8, fontSize: 10, fontFamily: C.font }}>
                            <span style={{ color: C.textDim, fontWeight: 600 }}>Learning Rate</span>
                            <input type="range" min={-4} max={0} step={.05} value={Math.log10(lr)} onChange={e => setLr(Math.pow(10, parseFloat(e.target.value)))} style={{ width: 80, accentColor: C.accent }} />
                            <span style={{ color: C.text, minWidth: 50, fontWeight: 600 }}>{lr.toFixed(4)}</span>
                        </div>
                    </div>

                    {/* TOP ROW: Gallery | Architecture | Training | Diagram */}
                    <div style={{ flex: "0 0 380px", display: "flex", overflow: "hidden", borderBottom: "1px solid " + C.border }}>
                        <div style={{ width: 300, flexShrink: 0, padding: 10, display: "flex", flexDirection: "column", borderRight: "1px solid " + C.border, minHeight: 0 }}>
                            <SampleGallery data={data} width={imgW} height={imgH} outputNames={outputNames} splits={{ train: splits.train.length, val: splits.val.length, test: splits.test.length }} splitTag={splitTag} selected={selected} onSelect={setSelected} />
                        </div>
                        <div style={{ width: 270, flexShrink: 0, padding: 10, overflow: "auto", borderRight: "1px solid " + C.border }}>
                            <CNNConfig arch={arch} imgW={imgW} imgH={imgH} numClasses={numClasses} dimInfo={dimInfo} onArchChange={onArchChange} onPoolChange={onPoolChange} />
                        </div>
                        <div style={{ width: 170, flexShrink: 0, padding: 10, overflow: "auto", borderRight: "1px solid " + C.border }}>
                            <TrainingConfig trainSize={splits.train.length} batchSize={batchSize} onBatch={setBatchSize} shuffle={shuffle} onShuffle={setShuffle} seed={seed} onSeed={setSeed} />
                        </div>
                        <div style={{ flex: 1, padding: 10, display: "flex", flexDirection: "column", overflow: "hidden", minWidth: 0 }}>
                            <ArchitectureDiagram dimInfo={dimInfo} onHoverConv={setHighlightConv} />
                        </div>
                    </div>

                    {/* PREDICTION STRIP */}
                    <div style={{ background: C.surface, borderBottom: "1px solid " + C.border, flexShrink: 0 }}>
                        <PredictionStrip networkRef={netRef} sample={selectedSample} sampleIndex={selected} width={imgW} height={imgH} outputNames={outputNames} renderTick={renderTick} />
                    </div>

                    {/* BOTTOM ROW: Loss | Confusion | Kernels */}
                    <div style={{ height: 280, display: "flex", overflow: "hidden" }}>
                        <div style={{ flex: 1, padding: 10, display: "flex", flexDirection: "column", overflow: "hidden", minHeight: 0, borderRight: "1px solid " + C.border }}>
                            <LossChart history={lossHistory} valHistory={valLossHistory} loss={loss} valLoss={valLoss} epoch={epoch} fixedMax={lossMaxRef.current} />
                        </div>
                        <div style={{ flex: 1, padding: 10, display: "flex", flexDirection: "column", overflow: "hidden", minHeight: 0, borderRight: "1px solid " + C.border }}>
                            <ConfusionMatrix networkRef={netRef} data={splits.train} outputNames={outputNames} renderTick={renderTick} valAcc={valAcc} testAcc={testAcc} />
                        </div>
                        <div style={{ width: 400, flexShrink: 0, padding: 10, display: "flex", flexDirection: "column", overflow: "hidden", minHeight: 0 }}>
                            <KernelVisualization networkRef={netRef} renderTick={renderTick} highlightConv={highlightConv} />
                        </div>
                    </div>

                    {/* FOOTER */}
                    <div style={{ padding: "12px 16px", borderTop: "1px solid " + C.border, flexShrink: 0, background: C.surface, display: "flex", gap: 8, justifyContent: "center", alignItems: "center" }}>
                        <input ref={csvFileRef} type="file" accept=".csv,.tsv,.txt" style={{ display: "none" }} onChange={(e) => {
                            const file = e.target.files && e.target.files[0]; if (!file) return;
                            const reader = new FileReader();
                            reader.onload = (ev) => onImportCSV(ev.target.result);
                            reader.readAsText(file); e.target.value = "";
                        }} />
                        <button onClick={() => csvFileRef.current && csvFileRef.current.click()} style={{ ...btnBase, background: "#e8f0fe", color: "#2a5db0", border: "1px solid #b8cfe8" }}>📂 Import CSV</button>
                        <button onClick={() => downloadFile(exportImageCSV(data, outputNames), 'dataset.csv', 'text/csv')} style={{ ...btnBase, background: "#e8f0fe", color: "#2a5db0", border: "1px solid #b8cfe8" }}>💾 Export CSV</button>
                        <div style={{ width: 16 }} />
                        <button onClick={onImportNet} style={{ ...btnBase, background: "#ecf8f3", color: "#16724e", border: "1px solid #b0dcc8" }}>🧠 Import Net (.json)</button>
                        <button onClick={onExportNet} style={{ ...btnBase, background: "#ecf8f3", color: "#16724e", border: "1px solid #b0dcc8" }}>🔬 Export Net (.json)</button>
                    </div>

                    {widthPending && <WidthDialog pending={widthPending} onCancel={() => setWidthPending(null)} onConfirm={confirmWidth} />}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>

</html>
